[project]
name = "job-postings-mcp"
version = "0.1.0"
description = "A small MCP server that lets AI assistants search a sample dataset of job postings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
job-postings-mcp = "job_postings_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_postings_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
